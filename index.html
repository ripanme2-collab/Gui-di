<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Dành Tặng Dì Yêu Quý</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d0f18;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(235, 77, 75, 0.25) 0%, rgba(13, 15, 24, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #ff7675;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 118, 117, 0.4);
        }

        header p {
            font-size: 1.1rem;
            color: #a29bfe;
        }

        /* Timeline Container */
        .timeline {
            position: relative;
            margin: 40px 0;
            padding-left: 30px;
            border-left: 3px solid #ff7675;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        .timeline-item:nth-child(1) { animation-delay: 0.2s; }
        .timeline-item:nth-child(2) { animation-delay: 0.5s; }
        .timeline-item:nth-child(3) { animation-delay: 0.8s; }
        .timeline-item:nth-child(4) { animation-delay: 1.1s; }

        .timeline-dot {
            position: absolute;
            left: -39px;
            top: 5px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #e84393;
            border: 3px solid #0d0f18;
            box-shadow: 0 0 10px #e84393;
        }
